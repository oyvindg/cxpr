name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default --parallel

      - name: Test
        run: ctest --preset default

      - name: Install
        run: cmake --install build --prefix "${{ runner.temp }}/cxpr-install"

      - name: Test installed package
        run: >
          cmake -S tests/consumer -B build-consumer
          -DCMAKE_PREFIX_PATH="${{ runner.temp }}/cxpr-install"
          -DCMAKE_C_COMPILER="${{ matrix.cc }}"
          && cmake --build build-consumer
          && ./build-consumer/cxpr_consumer

  strict:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset strict

      - name: Build
        run: cmake --build --preset strict --parallel

      - name: Test
        run: ctest --preset strict

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan --parallel

      - name: Test
        run: ctest --preset asan

      - name: Verify core instrumentation
        run: scripts/check_compile_instrumentation.sh build-asan -fsanitize=address

  ubsan:
    runs-on: ubuntu-latest
    env:
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ubsan

      - name: Build
        run: cmake --build --preset ubsan --parallel

      - name: Test
        run: ctest --preset ubsan

      - name: Verify core instrumentation
        run: scripts/check_compile_instrumentation.sh build-ubsan -fsanitize=undefined

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset coverage
      - run: cmake --build --preset coverage --parallel
      - run: ctest --preset coverage
      - run: scripts/check_compile_instrumentation.sh build-coverage --coverage

  build-options:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shared: [OFF, ON]
        tools: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build-options
          -DCMAKE_BUILD_TYPE=Debug
          -DCXPR_BUILD_SHARED=${{ matrix.shared }}
          -DCXPR_BUILD_TOOLS=${{ matrix.tools }}
          -DCXPR_BUILD_BENCHMARKS=OFF
      - run: cmake --build build-options --parallel
      - run: ctest --test-dir build-options --output-on-failure

  cmake-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --user cmake==3.21.4
      - run: ~/.local/bin/cmake -S . -B build-cmake-min -DCXPR_BUILD_BENCHMARKS=OFF
      - run: ~/.local/bin/cmake --build build-cmake-min --parallel

  fuzz:
    runs-on: ubuntu-latest
    env:
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset fuzz

      - name: Build
        run: cmake --build --preset fuzz --parallel

      - name: Smoke-run parser fuzzer
        run: >
          ./build-fuzz/tests/fuzz/cxpr_fuzz_parse
          -max_total_time=30 -print_final_stats=1
          build-fuzz/tests/fuzz/corpus
