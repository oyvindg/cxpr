name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default --parallel

      - name: Test
        run: ctest --preset default

      - name: Install
        run: cmake --install build --prefix "${{ runner.temp }}/cxpr-install"

      - name: Test installed package
        run: >
          cmake -S tests/consumer -B build-consumer
          -DCMAKE_PREFIX_PATH="${{ runner.temp }}/cxpr-install"
          -DCMAKE_C_COMPILER="${{ matrix.cc }}"
          && cmake --build build-consumer
          && ./build-consumer/cxpr_consumer

  strict:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset strict

      - name: Build
        run: cmake --build --preset strict --parallel

      - name: Test
        run: ctest --preset strict

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan --parallel

      - name: Test
        run: ctest --preset asan

  ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ubsan

      - name: Build
        run: cmake --build --preset ubsan --parallel

      - name: Test
        run: ctest --preset ubsan

  fuzz:
    runs-on: ubuntu-latest
    env:
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset fuzz

      - name: Build
        run: cmake --build --preset fuzz --parallel

      - name: Smoke-run parser fuzzer
        run: >
          ./build-fuzz/fuzz/cxpr_fuzz_parse
          -max_total_time=30 -print_final_stats=1
          build-fuzz/fuzz/corpus
