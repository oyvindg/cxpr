<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cxpr Flow Snapshot</title>
  <script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #dbe5ef;
      background: #121820;
    }
    main {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100%;
    }
    header {
      padding: 14px 18px;
      border-bottom: 1px solid #293443;
      background: #18212b;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 650;
    }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 8px;
    }
    .scenario-picker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #93a4b7;
      font-size: 13px;
    }
    select {
      color: #dbe5ef;
      background: #10161d;
      border: 1px solid #344154;
      border-radius: 4px;
      padding: 5px 28px 5px 8px;
      font: inherit;
    }
    dl {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 4px 12px;
      margin: 0;
      font-size: 13px;
    }
    dt {
      color: #93a4b7;
    }
    dd {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow-wrap: anywhere;
    }
    .panes {
      display: grid;
      grid-template-columns: minmax(300px, 0.8fr) minmax(380px, 1fr) minmax(420px, 1.2fr);
      min-height: 0;
    }
    section {
      display: grid;
      grid-template-rows: auto 1fr;
      min-width: 0;
      min-height: 0;
      border-right: 1px solid #293443;
    }
    section:last-child {
      border-right: 0;
    }
    .ast-pane {
      grid-template-rows: auto auto 1fr;
    }
    h2 {
      margin: 0;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 650;
      border-bottom: 1px solid #293443;
      background: #18212b;
    }
    #evaluation {
      padding: 10px 14px;
      border-bottom: 1px solid #293443;
      background: #141c25;
      color: #d4d4d4;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
      overflow-x: auto;
      white-space: pre;
    }
    #flow, #ast, #full {
      min-height: 0;
      background: #10161d;
    }
    @media (max-width: 860px) {
      .panes {
        grid-template-columns: 1fr;
        grid-template-rows: 45vh 1fr;
      }
      section {
        border-right: 0;
        border-bottom: 1px solid #293443;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="topline">
        <h1>cxpr Flow Snapshot</h1>
        <label class="scenario-picker">
          Example
          <select id="scenario">
            <option value="trading">Trading</option>
            <option value="physics">Physics</option>
            <option value="chemistry">Chemistry</option>
            <option value="robotics">Robotics</option>
            <option value="quantum">Quantum</option>
          </select>
        </label>
      </div>
      <dl>
        <dt>Name</dt><dd id="name">loading</dd>
        <dt>Expression</dt><dd id="expression">loading</dd>
        <dt>Resolved</dt><dd id="resolved">loading</dd>
      </dl>
    </header>
    <div class="panes">
      <section>
        <h2>Expression Flow</h2>
        <div id="flow"></div>
      </section>
      <section class="ast-pane">
        <h2 id="ast-title">AST Drilldown</h2>
        <div id="evaluation">loading</div>
        <div id="ast"></div>
      </section>
      <section>
        <h2>Full Evaluation Tree</h2>
        <div id="full"></div>
      </section>
    </div>
  </main>
  <script>
    let astCy = null;
    let fullCy = null;
    let flowCy = null;
    let currentSnapshot = null;
    const expressionRoles = {
      entry: "entry",
      blocked_entry: "blocked",
      exit: "exit"
    };
    const roleLabels = {
      entry: "Entry Signals",
      blocked: "Blocked Entry",
      exit: "Exit Signals",
      source: "Context",
      param: "Params",
      function: "Functions",
      sample: "Samples"
    };
    const tokenColors = {
      function: "#DCDCAA",
      functionNode: "#C586C0",
      parameter: "#4FC1FF",
      property: "#9CDCFE",
      qualifier: "#4EC9B0",
      number: "#B5CEA8",
      keyword: "#C586C0",
      symbolReference: "#D7BA7D",
      syntax: "#569CD6",
      foreground: "#D4D4D4",
      true: "#4EC9B0",
      false: "#F87171",
      group: "#9CA3AF"
    };

    function valueLabel(ele) {
      const d = ele.data();
      if (d.display_label) return d.display_label;
      const title = d.name || d.label || "";
      const expression = d.expression ? `\n${d.expression}` : "";
      const resolved = d.resolved ? `\n= ${d.resolved}` : "";
      const value = !d.resolved && d.value ? `\n= ${d.value}` : "";
      return `${title}${expression}${resolved}${value}`;
    }

    function commonNodeStyle() {
      return [
        {
          selector: "node",
          style: {
            "shape": "round-rectangle",
            "width": "label",
            "height": "label",
            "padding": "10px",
            "background-color": "#1f1f1f",
            "border-width": 1,
            "border-color": "#2a3a4f",
            "label": valueLabel,
            "font-size": 12,
            "color": tokenColors.foreground,
            "text-wrap": "wrap",
            "text-max-width": 160,
            "text-valign": "center",
            "text-halign": "center"
          }
        },
        {
          selector: "node[state = 'true']",
          style: {
            "background-color": "#17302b",
            "border-color": tokenColors.true,
            "color": tokenColors.true
          }
        },
        {
          selector: "node[state = 'false']",
          style: {
            "background-color": "#351f26",
            "border-color": tokenColors.false,
            "color": tokenColors.false
          }
        },
        {
          selector: "node[dimmed_by_false = 'true']",
          style: {
            "background-color": "#171d24",
            "border-color": "#384252",
            "color": "#7b8796"
          }
        },
        {
          selector: "node[dimmed_hover = 'true']",
          style: {
            "background-color": "#351f26",
            "border-color": tokenColors.false,
            "color": tokenColors.false
          }
        },
        {
          selector: "node[dimmed_hover = 'true'][state = 'number'], node[dimmed_hover = 'true'][state = 'value']",
          style: {
            "background-color": "#22291f",
            "border-color": tokenColors.number,
            "color": tokenColors.number
          }
        },
        {
          selector: "node[dimmed_hover = 'true'][kind = 'identifier'], node[dimmed_hover = 'true'][kind = 'lookback'], node[dimmed_hover = 'true'][role = 'source']",
          style: {
            "background-color": "#1d2a30",
            "border-color": tokenColors.property,
            "color": tokenColors.property
          }
        },
        {
          selector: "node[dimmed_hover = 'true'][kind = 'variable']",
          style: {
            "background-color": "#172836",
            "border-color": tokenColors.parameter,
            "color": tokenColors.parameter
          }
        },
        {
          selector: "node[dimmed_hover = 'true'][role = 'function']",
          style: {
            "background-color": "#30213a",
            "border-color": tokenColors.functionNode,
            "color": tokenColors.functionNode
          }
        },
        {
          selector: "node[state = 'number'], node[state = 'value']",
          style: {
            "background-color": "#22291f",
            "border-color": tokenColors.number,
            "color": tokenColors.number
          }
        },
        {
          selector: "node[kind = 'variable']",
          style: {
            "background-color": "#172836",
            "border-color": tokenColors.parameter,
            "color": tokenColors.parameter,
            "border-width": 2
          }
        },
        {
          selector: "node[kind = 'identifier'], node[kind = 'lookback'], node[role = 'source']",
          style: {
            "background-color": "#1d2a30",
            "border-color": tokenColors.property,
            "color": tokenColors.property,
            "border-width": 2
          }
        },
        {
          selector: "node[role = 'function']",
          style: {
            "background-color": "#30213a",
            "border-color": tokenColors.functionNode,
            "color": tokenColors.functionNode,
            "border-width": 2
          }
        },
        {
          selector: "node[state = 'skipped']",
          style: {
            "background-color": "#151a21",
            "border-color": "#303948",
            "color": "#737f8f"
          }
        },
        {
          selector: "node[dimmed_by_false = 'true'][kind], node[dimmed_by_false = 'true'][role]",
          style: {
            "background-color": "#171d24",
            "border-color": "#384252",
            "color": "#7b8796"
          }
        },
        {
          selector: "node[state = 'error']",
          style: {
            "background-color": "#2d2518",
            "border-color": tokenColors.symbolReference,
            "color": tokenColors.symbolReference
          }
        },
        {
          selector: "edge",
          style: {
            "curve-style": "unbundled-bezier",
            "control-point-distances": 24,
            "control-point-weights": 0.5,
            "source-arrow-shape": "triangle",
            "source-arrow-color": "#8a95a3",
            "target-arrow-shape": "none",
            "line-color": "#8a95a3",
            "width": 1.15,
            "label": "data(role)",
            "font-size": 10,
            "color": "#596778",
            "text-rotation": "none",
            "text-margin-y": -7,
            "text-background-color": "#10161d",
            "text-background-opacity": 1,
            "text-background-padding": 2
          }
        },
        {
          selector: "edge[dimmed_by_false = 'true']",
          style: {
            "line-color": "#384252",
            "source-arrow-color": "#384252",
            "target-arrow-color": "#384252",
            "color": "#7b8796"
          }
        },
        {
          selector: "edge[dimmed_hover = 'true']",
          style: {
            "line-color": tokenColors.false,
            "source-arrow-color": tokenColors.false,
            "target-arrow-color": tokenColors.false,
            "color": tokenColors.false
          }
        },
        {
          selector: "edge[context_edge = 'true']",
          style: {
            "curve-style": "bezier",
            "source-arrow-shape": "none",
            "target-arrow-shape": "triangle",
            "width": 1.6,
            "text-margin-y": -10
          }
        },
        {
          selector: "$node > node",
          style: {
            "background-opacity": 0.08,
            "border-width": 0,
            "padding": "18px",
            "text-valign": "top",
            "text-margin-y": -14,
            "text-halign": "center",
            "font-size": 13,
            "font-weight": 650
          }
        },
        {
          selector: "node[group_role]",
          style: {
            "background-color": tokenColors.group,
            "border-color": tokenColors.group,
            "color": "#dbe5ef"
          }
        }
      ];
    }

    function markFalseDescendants(elements) {
      const cloned = JSON.parse(JSON.stringify(elements || { nodes: [], edges: [] }));
      const nodes = cloned.nodes || [];
      const edges = cloned.edges || [];
      const nodeById = new Map(nodes.map((node) => [node.data.id, node]));
      const childrenById = new Map();

      edges.forEach((edge) => {
        const source = edge.data.source;
        const target = edge.data.target;
        if (!childrenById.has(source)) childrenById.set(source, []);
        childrenById.get(source).push(target);
      });

      nodes
        .filter((node) => node.data.state === "false")
        .forEach((falseNode) => {
          const stack = [...(childrenById.get(falseNode.data.id) || [])];
          const seen = new Set();
          while (stack.length > 0) {
            const id = stack.pop();
            if (seen.has(id)) continue;
            seen.add(id);
            const node = nodeById.get(id);
            if (node) node.data.dimmed_by_false = "true";
            (childrenById.get(id) || []).forEach((childId) => stack.push(childId));
          }
        });

      edges.forEach((edge) => {
        const target = nodeById.get(edge.data.target);
        if (target?.data.dimmed_by_false === "true") edge.data.dimmed_by_false = "true";
      });

      return cloned;
    }

    function dedupeAstLeafNodes(elements) {
      const leafKinds = new Set(["identifier", "lookback", "variable", "number", "bool", "string"]);
      const nodes = elements.nodes || [];
      const edges = elements.edges || [];
      const canonicalByKey = new Map();
      const targetById = new Map();
      const reuseCountById = new Map();
      const keepNodeIds = new Set();
      const nodeById = new Map(nodes.map((node) => [node.data.id, node.data]));
      const parentEdgeByTarget = new Map(edges.map((edge) => [edge.data.target, edge.data]));

      function leafKey(data) {
        if (!leafKinds.has(data.kind) || data.id === "n0") return "";
        if ((data.role || "").startsWith("sample[")) return "";
        const parentEdge = parentEdgeByTarget.get(data.id);
        const parent = parentEdge ? nodeById.get(parentEdge.source) : null;
        const parentKey = parent ? (parent.source || parent.label || parent.id || "") : "";
        const label = data.source || data.label || data.display_label || "";
        const value = data.resolved || data.value || "";
        return `${parentKey}:${data.kind}:${label}:${value}`;
      }

      nodes.forEach((node) => {
        const key = leafKey(node.data);
        if (!key) {
          keepNodeIds.add(node.data.id);
          targetById.set(node.data.id, node.data.id);
          return;
        }
        const existingId = canonicalByKey.get(key);
        if (existingId) {
          targetById.set(node.data.id, existingId);
          reuseCountById.set(existingId, (reuseCountById.get(existingId) || 1) + 1);
          return;
        }
        canonicalByKey.set(key, node.data.id);
        keepNodeIds.add(node.data.id);
        targetById.set(node.data.id, node.data.id);
        reuseCountById.set(node.data.id, 1);
      });

      elements.nodes = nodes.filter((node) => keepNodeIds.has(node.data.id));
      elements.nodes.forEach((node) => {
        const count = reuseCountById.get(node.data.id) || 1;
        if (count <= 1) return;
        const base = node.data.display_label || node.data.label || node.data.source || "";
        node.data.display_label = `${base}\nx${count}`;
      });

      const edgeKeys = new Set();
      elements.edges = edges
        .map((edge) => ({
          data: {
            ...edge.data,
            source: targetById.get(edge.data.source) || edge.data.source,
            target: targetById.get(edge.data.target) || edge.data.target
          }
        }))
        .filter((edge) => {
          if (edge.data.source === edge.data.target) return false;
          const key = `${edge.data.source}->${edge.data.target}:${edge.data.role || ""}`;
          if (edgeKeys.has(key)) return false;
          edgeKeys.add(key);
          return true;
        });

      return elements;
    }

    function groupMatchingNodes(elements, groupId, groupRole, predicate) {
      const matchingNodes = (elements.nodes || []).filter((node) => predicate(node.data));
      if (matchingNodes.length <= 1) return elements;
      matchingNodes.forEach((node) => {
        node.data.parent = groupId;
      });
      elements.nodes.push({
        data: {
          id: groupId,
          label: roleLabels[groupRole] || groupRole,
          display_label: roleLabels[groupRole] || groupRole,
          group_role: groupRole
        }
      });
      return elements;
    }

    function groupSampleNodes(elements, prefix) {
      const nodes = elements.nodes || [];
      const edges = elements.edges || [];
      const nodeById = new Map(nodes.map((node) => [node.data.id, node.data]));
      const sampleNodes = nodes.filter((node) => (node.data.role || "").startsWith("sample["));
      if (sampleNodes.length <= 1) return elements;

      const parentIds = new Set();
      edges.forEach((edge) => {
        if ((nodeById.get(edge.data.target)?.role || "").startsWith("sample[")) {
          parentIds.add(edge.data.source);
        }
      });
      const parentNames = [...parentIds]
        .map((id) => nodeById.get(id))
        .filter((data) => data && data.kind === "function_call")
        .map((data) => data.label || data.source)
        .filter(Boolean);
      const label = parentNames.length === 1 && parentIds.size === 1
        ? parentNames[0]
        : roleLabels.sample;

      sampleNodes.forEach((node) => {
        node.data.parent = `${prefix}_sample`;
      });
      elements.nodes.push({
        data: {
          id: `${prefix}_sample`,
          label,
          display_label: label,
          group_role: "sample"
        }
      });
      return elements;
    }

    function groupAstAuxiliaryNodes(elements, prefix) {
      groupMatchingNodes(
        elements,
        `${prefix}_function`,
        "function",
        (data) => data.role === "function"
      );
      groupSampleNodes(elements, prefix);
      return elements;
    }

    function simplifySampleLabels(elements) {
      (elements.nodes || []).forEach((node) => {
        const data = node.data;
        if (!(data.role || "").startsWith("sample[")) return;
        if (data.display_label) {
          data.display_label = data.display_label.replace(/^sample\[\d+\]:\s*/, "");
        }
      });
      return elements;
    }

    function prepareAstElements(snapshot, name) {
      const elements = simplifySampleLabels(dedupeAstLeafNodes(markFalseDescendants(snapshot.elements)));
      const root = (elements.nodes || []).find((node) => node.data.id === "n0");
      if (root && name && snapshot.expression) {
        root.data.display_label = `${name} = ${snapshot.expression}\n= ${snapshot.resolved || root.data.value || ""}`;
      }
      return groupAstAuxiliaryNodes(elements, "group");
    }

    function buildFullTreeElements(doc) {
      const elements = { nodes: [], edges: [] };
      const edgeKeys = new Set();
      const snapshots = doc.snapshots || [];
      const flowNodes = doc.flow?.nodes || [];
      const flowEdges = doc.flow?.edges || [];
      const expressionFlowNodes = flowNodes.filter((node) => node.data.kind === "expression");
      const contextFlowNodes = flowNodes.filter((node) =>
        node.data.kind === "source" || node.data.kind === "param"
      );
      const contextCountByKind = new Map();
      contextFlowNodes.forEach((node) => {
        contextCountByKind.set(node.data.kind, (contextCountByKind.get(node.data.kind) || 0) + 1);
      });
      const contextIdByName = new Map(
        contextFlowNodes.map((node) => [node.data.name, `full_ctx_${node.data.id}`])
      );
      const literalIdByKey = new Map();
      const callIdBySource = new Map();
      const usedContextGroups = new Set();

      contextFlowNodes.forEach((node) => {
        const groupId = `full_group_${node.data.kind}`;
        const useGroup = (contextCountByKind.get(node.data.kind) || 0) > 1;
        if (useGroup) usedContextGroups.add(node.data.kind);
        elements.nodes.push({
          data: {
            ...node.data,
            id: `full_ctx_${node.data.id}`,
            snapshot_index: undefined,
            parent: useGroup ? groupId : undefined
          }
        });
      });
      usedContextGroups.forEach((kind) => {
        elements.nodes.push({
          data: {
            id: `full_group_${kind}`,
            label: roleLabels[kind] || kind,
            display_label: roleLabels[kind] || kind,
            group_role: kind
          }
        });
      });

      expressionFlowNodes.forEach((node) => {
        const exprId = `full_expr_${node.data.index}`;
        const snapshot = snapshots[node.data.snapshot_index]?.snapshot;
        elements.nodes.push({
          data: {
            ...node.data,
            id: exprId,
            flow_id: node.data.id,
            parent: undefined
          }
        });

        if (!snapshot?.elements) return;
        const astElements = simplifySampleLabels(markFalseDescendants(snapshot.elements));
        const astNodeById = new Map(
          (astElements.nodes || []).map((astNode) => [astNode.data.id, astNode.data])
        );
        const astNodeTargetById = new Map();
        (astElements.nodes || []).forEach((astNode) => {
          if (astNode.data.id === "n0") return;
          if (astNode.data.kind === "variable") {
            const paramName = (astNode.data.label || "").startsWith("$")
              ? astNode.data.label
              : `$${astNode.data.label}`;
            const paramId = contextIdByName.get(paramName);
            if (paramId) {
              astNodeTargetById.set(astNode.data.id, paramId);
              return;
            }
          }
          if (astNode.data.kind === "identifier" || astNode.data.kind === "lookback") {
            const sourceId = contextIdByName.get(astNode.data.source || astNode.data.label);
            if (sourceId) {
              astNodeTargetById.set(astNode.data.id, sourceId);
              return;
            }
          }
          if (astNode.data.kind === "number" || astNode.data.kind === "bool" || astNode.data.kind === "string") {
            const literalKey = `${astNode.data.kind}:${astNode.data.source || astNode.data.label}`;
            const existingId = literalIdByKey.get(literalKey);
            if (existingId) {
              astNodeTargetById.set(astNode.data.id, existingId);
              return;
            }
            const literalId = `full_literal_${literalIdByKey.size}`;
            literalIdByKey.set(literalKey, literalId);
            astNodeTargetById.set(astNode.data.id, literalId);
            elements.nodes.push({
              data: {
                ...astNode.data,
                id: literalId,
                owner_snapshot_index: node.data.snapshot_index,
                owner_name: node.data.name,
                owner_flow_id: node.data.id,
                name: undefined
              }
            });
            return;
          }
          if (astNode.data.kind === "function_call" && astNode.data.source) {
            const existingId = callIdBySource.get(astNode.data.source);
            if (existingId) {
              astNodeTargetById.set(astNode.data.id, existingId);
              return;
            }
            const callId = `full_call_${callIdBySource.size}`;
            callIdBySource.set(astNode.data.source, callId);
            astNodeTargetById.set(astNode.data.id, callId);
            elements.nodes.push({
              data: {
                ...astNode.data,
                id: callId,
                owner_snapshot_index: node.data.snapshot_index,
                owner_name: node.data.name,
                owner_flow_id: node.data.id,
                name: undefined
              }
            });
            return;
          }
          astNodeTargetById.set(astNode.data.id, `full_ast_${node.data.index}_${astNode.data.id}`);
          elements.nodes.push({
            data: {
              ...astNode.data,
              id: `full_ast_${node.data.index}_${astNode.data.id}`,
              owner_snapshot_index: node.data.snapshot_index,
              owner_name: node.data.name,
              owner_flow_id: node.data.id,
              name: undefined
            }
          });
        });
        (astElements.edges || []).forEach((astEdge) => {
          const sourceAstNode = astNodeById.get(astEdge.data.source);
          let source = astEdge.data.source === "n0"
            ? exprId
            : astNodeTargetById.get(astEdge.data.source);
          let target = astEdge.data.target === "n0"
            ? exprId
            : astNodeTargetById.get(astEdge.data.target);
          if (sourceAstNode?.kind === "lookback") {
            const tmp = source;
            source = target;
            target = tmp;
          }
          if (!source || !target || source === target) return;
          const edgeKey = `${source}->${target}`;
          if (edgeKeys.has(edgeKey)) return;
          edgeKeys.add(edgeKey);
          elements.edges.push({
            data: {
              ...astEdge.data,
              id: `full_ast_e_${node.data.index}_${astEdge.data.id}`,
              source,
              target
            }
          });
        });
      });

      flowEdges.forEach((edge) => {
        const source = flowNodes.find((node) => node.data.id === edge.data.source)?.data;
        const target = flowNodes.find((node) => node.data.id === edge.data.target)?.data;
        if (!source || !target || target.kind !== "expression") return;
        const sourceId = source.kind === "expression"
          ? `full_expr_${source.index}`
          : `full_ctx_${source.id}`;
        const edgeKey = `${sourceId}->full_expr_${target.index}`;
        if (edgeKeys.has(edgeKey)) return;
        edgeKeys.add(edgeKey);
        elements.edges.push({
          data: {
            id: `full_flow_${edge.data.id}`,
            source: sourceId,
            target: `full_expr_${target.index}`,
            role: edge.data.source_name || source.name,
            context_edge: source.kind === "source" || source.kind === "param" ? "true" : undefined
          }
        });
      });

      {
        const connected = new Set();
        groupAstAuxiliaryNodes(elements, "full_group");
        elements.edges.forEach((edge) => {
          connected.add(edge.data.source);
          connected.add(edge.data.target);
        });
        elements.nodes = elements.nodes.filter((node) =>
          node.data.group_role || connected.has(node.data.id)
        );
      }
      return elements;
    }

    function arrangeFullContextGroups(cy) {
      const expressionBox = cy.nodes("node[kind = 'expression']").boundingBox();
      arrangeContextGroups(cy, expressionBox, "full_group_source", "full_group_param");
    }

    function arrangeAuxiliaryGroups(cy, groupPrefix, anchorSelector) {
      const anchorBox = cy.nodes(anchorSelector).boundingBox();
      const left = Number.isFinite(anchorBox.x1) ? anchorBox.x1 : -120;
      let top = Number.isFinite(anchorBox.y1) ? anchorBox.y1 - 120 : -160;
      const colWidth = 140;
      const rowHeight = 72;
      const groups = cy.nodes("node[group_role]").filter((node) => node.id().startsWith(groupPrefix));

      groups.forEach((group) => {
        const nodes = cy.nodes(`[parent = '${group.id()}']`);
        if (nodes.length === 0) return;
        const cols = Math.min(3, Math.max(1, nodes.length));
        nodes.forEach((node, index) => {
          node.position({
            x: left + (index % cols) * colWidth,
            y: top + Math.floor(index / cols) * rowHeight
          });
        });
        top += Math.ceil(nodes.length / cols) * rowHeight + 76;
      });
    }

    function arrangeContextGroups(cy, expressionBox, sourceGroupId, paramGroupId) {
      const sourceNodes = cy.nodes(`[parent = '${sourceGroupId}']`);
      const paramNodes = cy.nodes(`[parent = '${paramGroupId}']`);
      const left = Number.isFinite(expressionBox.x1) ? expressionBox.x1 - 280 : -360;
      let top = Number.isFinite(expressionBox.y1) ? expressionBox.y1 : 0;

      function placeGrid(nodes, startY) {
        const cols = 2;
        const colWidth = 130;
        const rowHeight = 78;
        nodes.forEach((node, index) => {
          node.position({
            x: left + (index % cols) * colWidth,
            y: startY + Math.floor(index / cols) * rowHeight
          });
        });
        return startY + Math.ceil(nodes.length / cols) * rowHeight + 110;
      }

      if (sourceNodes.length > 0) top = placeGrid(sourceNodes, top);
      if (paramNodes.length > 0) placeGrid(paramNodes, top);
    }

    function tintEdgesByTarget(cy) {
      function colorForNode(node) {
        const data = node.data();
        if (data.kind === "param" || data.kind === "variable") return tokenColors.parameter;
        if (data.kind === "source" || data.kind === "identifier" || data.kind === "lookback") return tokenColors.property;
        if (data.role === "function") return tokenColors.functionNode;
        if (data.state === "true") return tokenColors.true;
        if (data.state === "false") return tokenColors.false;
        if (data.state === "number" || data.state === "value") return tokenColors.number;
        return "";
      }

      function colorForEdge(edge) {
        const source = edge.source();
        const target = edge.target();
        const edgeData = edge.data();
        const targetData = target.data();
        const labelRepresentsSource =
          !!edgeData.source_name ||
          (edgeData.id || "").startsWith("full_flow_") ||
          (targetData.kind === "lookback" &&
            (edgeData.role === "source" || edgeData.role === "index"));
        return labelRepresentsSource
          ? colorForNode(source) || colorForNode(target)
          : colorForNode(target) || colorForNode(source);
      }

      cy.scratch("_edgeColorForEdge", colorForEdge);

      cy.edges().forEach((edge) => {
        if (edge.data("dimmed_by_false") === "true") return;
        const color = colorForEdge(edge);

        if (!color) return;
        edge.style({
          "line-color": color,
          "source-arrow-color": color,
          "target-arrow-color": color,
          "color": color
        });
      });
      cy.edges("[dimmed_by_false = 'true']").style({
        "line-color": "#384252",
        "source-arrow-color": "#384252",
        "target-arrow-color": "#384252",
        "color": "#7b8796",
        "text-background-color": "#10161d"
      });
    }

    function installDimmedHover(cy) {
      function hoverStyleFor(ele) {
        if (ele.isEdge && ele.isEdge()) {
          const colorForEdge = cy.scratch("_edgeColorForEdge");
          const color = colorForEdge ? colorForEdge(ele) : tokenColors.false;
          return {
            "line-color": color,
            "source-arrow-color": color,
            "target-arrow-color": color,
            "color": color
          };
        }
        const data = ele.data();
        if (data.kind === "variable") {
          return {"background-color": "#172836", "border-color": tokenColors.parameter, "color": tokenColors.parameter};
        }
        if (data.kind === "identifier" || data.kind === "lookback" || data.role === "source") {
          return {"background-color": "#1d2a30", "border-color": tokenColors.property, "color": tokenColors.property};
        }
        if (data.role === "function") {
          return {"background-color": "#30213a", "border-color": tokenColors.functionNode, "color": tokenColors.functionNode};
        }
        if (data.state === "number" || data.state === "value") {
          return {"background-color": "#22291f", "border-color": tokenColors.number, "color": tokenColors.number};
        }
        return {"background-color": "#351f26", "border-color": tokenColors.false, "color": tokenColors.false};
      }

      function dimStyleFor(ele) {
        if (ele.isEdge && ele.isEdge()) {
          return {
            "line-color": "#384252",
            "source-arrow-color": "#384252",
            "target-arrow-color": "#384252",
            "color": "#7b8796"
          };
        }
        return {
          "background-color": "#171d24",
          "border-color": "#384252",
          "color": "#7b8796"
        };
      }

      function falseSubtree(node) {
        const result = cy.collection();
        const stack = [node];
        const seen = new Set();
        let collected = result;
        while (stack.length > 0) {
          const current = stack.pop();
          if (!current || seen.has(current.id())) continue;
          seen.add(current.id());
          collected = collected.union(current);
          current.outgoers("edge").forEach((edge) => {
            collected = collected.union(edge);
            const child = edge.target();
            if (!child.data("group_role")) stack.push(child);
          });
        }
        return collected;
      }

      function clearHoverStyle(ele) {
        if (ele.data("dimmed_by_false") === "true") {
          ele.style(dimStyleFor(ele));
          return;
        }
        ele.removeStyle([
          "background-color",
          "border-color",
          "color",
          "line-color",
          "source-arrow-color",
          "target-arrow-color"
        ].join(" "));
      }

      cy.on("mouseover", "node[state = 'false'], node[dimmed_by_false = 'true']", (event) => {
        falseSubtree(event.target).forEach((ele) => {
          ele.data("dimmed_hover", "true");
          ele.style(hoverStyleFor(ele));
        });
      });
      cy.on("mouseout", "node[state = 'false'], node[dimmed_by_false = 'true']", (event) => {
        falseSubtree(event.target).forEach((ele) => {
          ele.removeData("dimmed_hover");
          clearHoverStyle(ele);
        });
        tintEdgesByTarget(cy);
      });
    }

    function renderFullTree(doc) {
      if (fullCy) fullCy.destroy();
      fullCy = cytoscape({
        container: document.getElementById("full"),
        elements: buildFullTreeElements(doc),
        layout: treeLayout({ spacingFactor: 1.7, padding: 64 }),
        style: commonNodeStyle().concat([
          {
            selector: "node[kind = 'expression'][state = 'number'], node[kind = 'expression'][state = 'value']",
            style: {
              "background-color": "#2b291b",
              "border-color": tokenColors.function,
              "color": tokenColors.function
            }
          },
          {
            selector: "node[kind = 'source']",
            style: {
              "background-color": "#1d2a30",
              "border-color": tokenColors.property,
              "color": tokenColors.property,
              "border-width": 2
            }
          },
          {
            selector: "node[kind = 'param']",
            style: {
              "background-color": "#172836",
              "border-color": tokenColors.parameter,
              "color": tokenColors.parameter,
              "border-width": 2
            }
          },
          {
            selector: "$node > node",
            style: {
              "background-opacity": 0.08,
              "border-width": 0,
              "padding": "18px",
              "text-valign": "top",
              "text-margin-y": -14,
              "text-halign": "center",
              "font-size": 13,
              "font-weight": 650
            }
          },
          {
            selector: "node[group_role = 'source'], node[group_role = 'param']",
            style: {
              "background-color": tokenColors.group,
              "border-color": tokenColors.group,
              "color": "#dbe5ef"
            }
          }
        ])
      });
      fullCy.ready(() => {
        arrangeFullContextGroups(fullCy);
        arrangeAuxiliaryGroups(fullCy, "full_group_", "node[kind = 'expression']");
        tintEdgesByTarget(fullCy);
        installDimmedHover(fullCy);
        fullCy.fit(undefined, 40);
      });
      fullCy.on("tap", "node", (event) => {
        const node = event.target;
        if (node.data("group_role")) return;

        let index = node.data("snapshot_index");
        let flowId = node.data("flow_id") || node.data("owner_flow_id");
        if (index === undefined || index === null) {
          index = node.data("owner_snapshot_index");
        }

        if ((index === undefined || index === null) && !flowId) {
          const neighbor = node
            .connectedEdges()
            .connectedNodes()
            .filter((candidate) => candidate.data("kind") === "expression")
            .first();
          if (neighbor.nonempty()) {
            index = neighbor.data("snapshot_index");
            flowId = neighbor.data("flow_id") || neighbor.data("owner_flow_id") || neighbor.data("id");
          }
        }

        const snapshotEntry = doc.snapshots?.[index];
        const snapshot = snapshotEntry?.snapshot;
        if (!snapshot) return;

        const flowNode = (doc.flow?.nodes || []).find((candidate) => candidate.data.id === flowId)
          || (doc.flow?.nodes || []).find((candidate) => candidate.data.snapshot_index === index);
        showSnapshot(
          snapshot,
          node.data("name") || node.data("owner_name") || snapshotEntry.name,
          flowNode,
          doc
        );
      });
    }

    function renderEvaluation(snapshot, name, flowNode, doc) {
      const lines = [];
      const flowNodes = doc?.flow?.nodes || [];
      const flowEdges = doc?.flow?.edges || [];
      const nodeById = new Map(flowNodes.map((node) => [node.data.id, node.data]));
      const flowData = typeof flowNode?.data === "function" ? flowNode.data() : (flowNode?.data || {});
      const targetId = flowData.id;
      const directInputs = flowEdges
        .filter((edge) => edge.data.target === targetId)
        .map((edge) => nodeById.get(edge.data.source))
        .filter(Boolean);
      const dependencies = directInputs.filter((node) => node.kind === "expression");
      const sources = directInputs.filter((node) => node.kind === "source");
      const params = directInputs.filter((node) => node.kind === "param");
      const sampleNodes = (snapshot.elements?.nodes || [])
        .map((node) => node.data)
        .filter((node) => (node.role || "").startsWith("sample["));
      const result = flowData.value || snapshot.result || "";

      lines.push(`${name || "expression"} = ${snapshot.expression || ""}`);
      if (snapshot.resolved && snapshot.resolved !== snapshot.expression) {
        lines.push(`values = ${snapshot.resolved}`);
      }
      if (result) lines.push(`result = ${result}`);

      if (dependencies.length) {
        lines.push("");
        lines.push("Dependencies:");
        dependencies.forEach((node) => {
          lines.push(`  ${node.name} = ${node.value}`);
        });
      }
      if (sources.length) {
        lines.push("");
        lines.push("Context:");
        sources.forEach((node) => {
          lines.push(`  ${node.name} = ${node.value}`);
        });
      }
      if (params.length) {
        lines.push("");
        lines.push("Params:");
        params.forEach((node) => {
          lines.push(`  ${node.name} = ${node.value}`);
        });
      }
      if (sampleNodes.length) {
        lines.push("");
        lines.push("Samples:");
        sampleNodes.forEach((node) => {
          lines.push(`  ${node.label} = ${node.value}`);
        });
      }

      document.getElementById("evaluation").textContent = lines.join("\n");
    }

    function treeLayout(options = {}) {
      return {
        name: "breadthfirst",
        directed: true,
        circle: false,
        grid: true,
        avoidOverlap: true,
        nodeDimensionsIncludeLabels: true,
        spacingFactor: options.spacingFactor || 1.8,
        padding: options.padding || 48,
        roots: options.roots
      };
    }

    function showSnapshot(snapshot, name, flowNode, doc) {
      currentSnapshot = snapshot;
      document.getElementById("name").textContent = name || "";
      document.getElementById("ast-title").textContent =
        name ? `AST Drilldown: ${name}` : "AST Drilldown";
      document.getElementById("expression").textContent = snapshot.expression || "";
      document.getElementById("resolved").textContent = snapshot.resolved || "";
      renderEvaluation(snapshot, name, flowNode, doc);
      if (astCy) astCy.destroy();
      astCy = cytoscape({
        container: document.getElementById("ast"),
        elements: prepareAstElements(snapshot, name),
        layout: treeLayout({ roots: ["n0"], spacingFactor: 1.55, padding: 36 }),
        style: commonNodeStyle()
      });
      astCy.ready(() => {
        arrangeAuxiliaryGroups(astCy, "group_", "#n0");
        tintEdgesByTarget(astCy);
        installDimmedHover(astCy);
        astCy.fit(undefined, 32);
      });
    }

    function snapshotFileForScenario(scenario) {
      return scenario === "trading" ? "snapshot.trading.json" : `snapshot.${scenario}.json`;
    }

    function prepareDoc(doc) {
      const usedRoles = new Set();
      doc.flow = doc.flow || { nodes: [], edges: [] };
      doc.flow.nodes = doc.flow.nodes || [];
      doc.flow.edges = doc.flow.edges || [];
      doc.flow.nodes = doc.flow.nodes.filter((node) => !node.data?.group_role);
      doc.flow.nodes.forEach((node) => {
        if (node.data) delete node.data.parent;
      });

      const roleCounts = new Map();
      doc.flow.nodes.forEach((node) => {
        const name = node.data && node.data.name;
        let role = null;
        if (name && expressionRoles[name]) role = expressionRoles[name];
        if (node.data?.kind === "source" || node.data?.kind === "param") role = node.data.kind;
        if (role) roleCounts.set(role, (roleCounts.get(role) || 0) + 1);
      });

      doc.flow.nodes.forEach((node) => {
        const name = node.data && node.data.name;
        if (name && expressionRoles[name]) {
          node.data.role = expressionRoles[name];
          if ((roleCounts.get(expressionRoles[name]) || 0) > 1) {
            node.data.parent = `group_${expressionRoles[name]}`;
            usedRoles.add(expressionRoles[name]);
          }
        }
        if (node.data?.kind === "source" || node.data?.kind === "param") {
          node.data.role = node.data.kind;
          if ((roleCounts.get(node.data.kind) || 0) > 1) {
            node.data.parent = `group_${node.data.kind}`;
            usedRoles.add(node.data.kind);
          }
        }
      });
      usedRoles.forEach((role) => {
        doc.flow.nodes.push({
          data: {
            id: `group_${role}`,
            label: roleLabels[role] || role,
            display_label: roleLabels[role] || role,
            group_role: role
          }
        });
      });
      const flowNodeById = new Map(doc.flow.nodes.map((node) => [node.data.id, node.data]));
      doc.flow.edges.forEach((edge) => {
        const source = flowNodeById.get(edge.data.source);
        if (source?.kind === "source" || source?.kind === "param") {
          edge.data.context_edge = "true";
        }
      });
    }

    function renderFlow(doc) {
      const snapshots = doc.snapshots || [];
      if (flowCy) flowCy.destroy();
      flowCy = cytoscape({
        container: document.getElementById("flow"),
        elements: doc.flow,
        layout: treeLayout({ spacingFactor: 2.05, padding: 56 }),
        style: commonNodeStyle().concat([
          {
            selector: "edge",
            style: { "label": "data(source_name)" }
          },
          {
            selector: "node:selected",
            style: { "border-width": 3, "border-color": "#2457a6" }
          },
          {
            selector: "node[kind = 'expression'][state = 'number'], node[kind = 'expression'][state = 'value']",
            style: {
              "background-color": "#2b291b",
              "border-color": tokenColors.function,
              "color": tokenColors.function
            }
          },
          {
            selector: "node[kind = 'source']",
            style: {
              "background-color": "#1d2a30",
              "border-color": tokenColors.property,
              "color": tokenColors.property,
              "border-width": 2
            }
          },
          {
            selector: "node[kind = 'param']",
            style: {
              "background-color": "#172836",
              "border-color": tokenColors.parameter,
              "color": tokenColors.parameter,
              "border-width": 2
            }
          },
          {
            selector: "node[role = 'entry']",
            style: {
              "background-color": "#17302b",
              "border-color": tokenColors.true,
              "color": tokenColors.true,
              "border-width": 2
            }
          },
          {
            selector: "node[role = 'exit'], node[role = 'blocked']",
            style: {
              "background-color": "#351f26",
              "border-color": tokenColors.false,
              "color": tokenColors.false,
              "border-width": 2
            }
          },
          {
            selector: "$node > node",
            style: {
              "background-opacity": 0.08,
              "border-width": 0,
              "padding": "18px",
              "text-valign": "top",
              "text-margin-y": -14,
              "text-halign": "center",
              "font-size": 13,
              "font-weight": 650
            }
          },
          {
            selector: "node[group_role = 'source'], node[group_role = 'param'], node[group_role = 'entry'], node[group_role = 'exit'], node[group_role = 'blocked']",
            style: {
              "background-color": tokenColors.group,
              "border-color": tokenColors.group,
              "color": "#dbe5ef"
            }
          }
        ])
      });
      flowCy.ready(() => {
        arrangeContextGroups(
          flowCy,
          flowCy.nodes("node[kind = 'expression']").boundingBox(),
          "group_source",
          "group_param"
        );
        tintEdgesByTarget(flowCy);
        installDimmedHover(flowCy);
        flowCy.fit(undefined, 40);
      });

      flowCy.on("tap", "node", (event) => {
        const index = event.target.data("snapshot_index");
        if (event.target.data("kind") !== "expression") return;
        if (snapshots[index]) {
          showSnapshot(
            snapshots[index].snapshot,
            event.target.data("name") || snapshots[index].name,
            event.target,
            doc
          );
        }
      });
    }

    function renderDoc(doc) {
      prepareDoc(doc);
      const snapshots = doc.snapshots || [];
      const first = snapshots[0] && snapshots[0].snapshot;
      const flowNodes = doc.flow?.nodes || [];
      if (first) {
        const firstFlowNode = flowNodes.find((node) => node.data.snapshot_index === 0);
        showSnapshot(first, snapshots[0].name, firstFlowNode, doc);
      }
      renderFullTree(doc);
      renderFlow(doc);
    }

    function loadScenario(scenario) {
      const file = snapshotFileForScenario(scenario);
      document.getElementById("name").textContent = "loading";
      document.getElementById("expression").textContent = file;
      document.getElementById("resolved").textContent = "";
      fetch(`${file}?v=${Date.now()}`)
        .then((response) => {
          if (!response.ok && scenario === "trading") {
            return fetch(`snapshot.json?v=${Date.now()}`);
          }
          return response;
        })
        .then((response) => {
          if (!response.ok) throw new Error(`${file} not found`);
          return response.json();
        })
        .then(renderDoc)
        .catch((err) => {
          document.getElementById("name").textContent = "error";
          document.getElementById("expression").textContent = err.message;
          document.getElementById("resolved").textContent =
            "Run the C example to generate snapshot.<scenario>.json.";
        });
    }

    document.getElementById("scenario").addEventListener("change", (event) => {
      loadScenario(event.target.value);
    });
    loadScenario(document.getElementById("scenario").value);
  </script>
</body>
</html>
